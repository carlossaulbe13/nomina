{% extends "base.html" %}
{% block title %}Empleados{% endblock %}

{% block content %}
<div x-data="empleadosApp()">

  <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="titulo">Empleados</h1>
      <p class="mt-1 text-sm text-arena-600" x-text="resumen"></p>
    </div>
    <button @click="abrirModal()" class="btn btn-primario w-full sm:w-auto">
      <svg class="h-4 w-4" aria-hidden="true"><use href="#ic-plus"></use></svg> Nuevo empleado
    </button>
  </header>

  <!-- Filtros -->
  <div class="tarjeta mb-4 flex flex-col gap-3 p-4 sm:flex-row sm:items-center">
    <div class="relative flex-1">
      <label for="busqueda" class="sr-only">Buscar empleado</label>
      <span class="pointer-events-none absolute inset-y-0 left-0 grid w-11 place-items-center text-arena-500"><svg class="h-4 w-4" aria-hidden="true"><use href="#ic-buscar"></use></svg></span>
      <input id="busqueda" x-model="busqueda" type="text" placeholder="Buscar por nombre…"
             autocapitalize="none" autocorrect="off" class="campo pl-11">
    </div>

    <label for="filtro-sucursal" class="sr-only">Sucursal</label>
    <select id="filtro-sucursal" x-model="filtroSucursal" class="campo campo-select sm:w-52">
      <option value="">Todas las sucursales</option>
      {% for sid, sname in sucursales.items() %}
      <option value="{{ sid }}">{{ sname }}</option>
      {% endfor %}
    </select>

    <button @click="soloActivos = !soloActivos" :aria-pressed="soloActivos"
            :class="soloActivos
              ? 'border-marca-600 bg-marca-50 text-marca-800'
              : 'border-arena-300 bg-white text-arena-600 hover:bg-arena-50'"
            class="btn shrink-0 border-2">
      Solo activos
    </button>
  </div>

  <!-- Celular: tarjetas -->
  <ul class="tarjeta divide-y divide-arena-200 md:hidden">
    <template x-if="loading">
      <li class="px-5 py-12 text-center text-sm text-arena-500">Cargando…</li>
    </template>
    <template x-for="emp in empleadosFiltrados" :key="emp.id">
      <li class="px-4 py-4">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="truncate font-medium text-arena-900" x-text="emp.nombre"></p>
            <p class="mt-0.5 text-sm text-arena-600" x-text="sucursalNombre(emp.sucursal_id)"></p>
          </div>
          <span :class="emp.activo ? 'bg-emerald-100 text-emerald-800' : 'bg-arena-200 text-arena-600'"
                class="chip shrink-0" x-text="emp.activo ? 'Activo' : 'Baja'"></span>
        </div>
        <div class="mt-3 flex gap-2">
          <button @click="abrirModal(emp)" class="btn btn-secundario btn-sm flex-1">Editar</button>
          <button x-show="emp.activo" @click="darBaja(emp)" class="btn btn-secundario btn-sm flex-1 text-red-600">Dar de baja</button>
          <button x-show="!emp.activo" @click="reactivar(emp)" class="btn btn-secundario btn-sm flex-1 text-emerald-700">Reactivar</button>
          {% if current_user.get('role') == 'dueno' %}
          <button @click="eliminar(emp)" class="btn btn-secundario btn-sm shrink-0 px-2.5 text-red-600"
                  :aria-label="'Eliminar a ' + emp.nombre" title="Eliminar definitivamente">
            <svg class="h-4 w-4" aria-hidden="true"><use href="#ic-basura"></use></svg>
          </button>
          {% endif %}
        </div>
      </li>
    </template>
    <template x-if="!loading && empleadosFiltrados.length === 0">
      <li class="px-5 py-12 text-center text-sm text-arena-500">Sin resultados</li>
    </template>
  </ul>

  <!-- Tablet y escritorio: tabla -->
  <div class="tarjeta hidden overflow-hidden md:block">
    <div class="overflow-x-auto scroll-suave">
      <table class="w-full text-sm">
        <thead class="bg-arena-50 text-arena-600">
          <tr>
            <th class="th">Nombre</th>
            <th class="th">Sucursal</th>
            <th class="th text-center">Estado</th>
            <th class="th text-right">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-arena-200">
          <template x-if="loading">
            <tr><td colspan="4" class="px-4 py-12 text-center text-arena-500">Cargando…</td></tr>
          </template>
          <template x-for="emp in empleadosFiltrados" :key="emp.id">
            <tr class="transition hover:bg-arena-50">
              <td class="td font-medium text-arena-900" x-text="emp.nombre"></td>
              <td class="td text-arena-600" x-text="sucursalNombre(emp.sucursal_id)"></td>
              <td class="td text-center">
                <span :class="emp.activo ? 'bg-emerald-100 text-emerald-800' : 'bg-arena-200 text-arena-600'"
                      class="chip" x-text="emp.activo ? 'Activo' : 'Baja'"></span>
              </td>
              <!-- El td llevaba `flex`, lo que sacaba la celda del layout de tabla
                   y descuadraba el ancho de las demas columnas. -->
              <td class="td">
                <div class="flex justify-end gap-2">
                  <button @click="abrirModal(emp)" class="btn btn-secundario btn-sm">Editar</button>
                  <button x-show="emp.activo" @click="darBaja(emp)" class="btn btn-secundario btn-sm text-red-600">Dar de baja</button>
                  <button x-show="!emp.activo" @click="reactivar(emp)" class="btn btn-secundario btn-sm text-emerald-700">Reactivar</button>
                  {% if current_user.get('role') == 'dueno' %}
                  <button @click="eliminar(emp)" class="btn btn-secundario btn-sm shrink-0 px-2.5 text-red-600"
                          :aria-label="'Eliminar a ' + emp.nombre" title="Eliminar definitivamente">
                    <svg class="h-4 w-4" aria-hidden="true"><use href="#ic-basura"></use></svg>
                  </button>
                  {% endif %}
                </div>
              </td>
            </tr>
          </template>
          <template x-if="!loading && empleadosFiltrados.length === 0">
            <tr><td colspan="4" class="px-4 py-12 text-center text-arena-500">Sin resultados</td></tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div x-show="confirm.show" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end justify-center bg-arena-950/40 p-4 backdrop-blur-sm sm:items-center"
       @click.self="cerrarConfirm(false)" @keydown.escape.window="if (confirm.show) cerrarConfirm(false)"
       role="dialog" aria-modal="true" aria-labelledby="titulo-confirm">
    <div class="tarjeta w-full max-w-md overflow-hidden shadow-flotante">
      <div class="flex items-start gap-3.5 px-6 pb-4 pt-6">
        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl"
              :class="confirm.tipo === 'danger' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'">
          <svg x-show="confirm.tipo === 'danger'" class="h-5 w-5" aria-hidden="true"><use href="#ic-alerta"></use></svg>
          <svg x-show="confirm.tipo !== 'danger'" class="h-5 w-5" aria-hidden="true"><use href="#ic-check"></use></svg>
        </span>
        <div>
          <h3 id="titulo-confirm" class="font-semibold text-arena-900" x-text="confirm.titulo"></h3>
          <p class="mt-1 text-sm text-arena-600" x-text="confirm.mensaje"></p>
          <p x-show="confirm.detalle" x-cloak x-text="confirm.detalle"
             class="mt-2.5 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-800"></p>
        </div>
      </div>
      <div class="flex flex-col-reverse gap-2 border-t border-arena-200 bg-arena-50 px-5 py-4 sm:flex-row sm:justify-end">
        <button x-ref="confirmCancelar" @click="cerrarConfirm(false)" class="btn btn-secundario">Cancelar</button>
        <button @click="cerrarConfirm(true)" class="btn"
                :class="confirm.tipo === 'danger' ? 'btn-peligro' : 'bg-emerald-600 text-white hover:bg-emerald-700'"
                x-text="confirm.btnOk"></button>
      </div>
    </div>
  </div>

  <!-- Modal alta / edición -->
  <div x-show="modal" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end justify-center bg-arena-950/40 p-4 backdrop-blur-sm sm:items-center"
       @click.self="cerrarModal()" @keydown.escape.window="if (modal) cerrarModal()"
       role="dialog" aria-modal="true" aria-labelledby="titulo-empleado">
    <div class="tarjeta w-full max-w-md overflow-hidden shadow-flotante">
      <div class="px-6 pb-5 pt-6">
        <h3 id="titulo-empleado" class="mb-5 font-marca text-xl font-semibold text-arena-900"
            x-text="editando ? 'Editar empleado' : 'Nuevo empleado'"></h3>

        <div class="space-y-4">
          <div>
            <label for="emp-nombre" class="etiqueta">Nombre completo</label>
            <input id="emp-nombre" x-model="form.nombre" type="text" class="campo"
                   placeholder="Nombre y apellidos">
          </div>
          <div>
            <label for="emp-sucursal" class="etiqueta">Sucursal</label>
            <select id="emp-sucursal" x-model="form.sucursal_id" class="campo campo-select">
              <option value="">Seleccionar…</option>
              {% for sid, sname in sucursales.items() %}
              <option value="{{ sid }}">{{ sname }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div x-show="formError" x-cloak
             class="mt-4 rounded-xl border border-red-200 bg-red-50 px-3.5 py-2.5 text-sm font-medium text-red-800"
             x-text="formError"></div>
      </div>

      <div class="flex flex-col-reverse gap-2 border-t border-arena-200 bg-arena-50 px-5 py-4 sm:flex-row sm:justify-end">
        <button @click="cerrarModal()" class="btn btn-secundario">Cancelar</button>
        <button @click="guardar()" :disabled="guardando" class="btn btn-primario"
                x-text="guardando ? 'Guardando…' : 'Guardar'"></button>
      </div>
    </div>
  </div>

</div>

<script>
  const SUCURSALES = {{ sucursales | tojson }};

  function empleadosApp() {
    return {
      empleados: [],
      busqueda: '',
      filtroSucursal: '',
      soloActivos: true,
      loading: true,
      modal: false,
      editando: null,
      form: { nombre: '', sucursal_id: '' },
      formError: '',
      guardando: false,
      confirm: { show: false, titulo: '', mensaje: '', detalle: '', tipo: 'danger', btnOk: 'Confirmar', resolve: null },

      async init() {
        try {
          const res = await fetch('/empleados/api');
          if (!res.ok) throw new Error();
          this.empleados = await res.json();
        } catch (_) {
          avisar('No se pudo cargar la lista de empleados');
        } finally {
          this.loading = false;
        }
      },

      get empleadosFiltrados() {
        const q = this.busqueda.trim().toLowerCase();
        return this.empleados.filter(e => {
          if (this.soloActivos && !e.activo) return false;
          if (this.filtroSucursal && e.sucursal_id !== this.filtroSucursal) return false;
          if (q && !e.nombre.toLowerCase().includes(q)) return false;
          return true;
        });
      },

      get resumen() {
        if (this.loading) return 'Cargando…';
        const n = this.empleadosFiltrados.length;
        return `${n} ${n === 1 ? 'empleado' : 'empleados'}` + (this.soloActivos ? ' activos' : '');
      },

      sucursalNombre(id) { return SUCURSALES[id] || id || '—'; },

      abrirModal(emp = null) {
        this.editando = emp;
        this.form = emp ? { nombre: emp.nombre, sucursal_id: emp.sucursal_id } : { nombre: '', sucursal_id: '' };
        this.formError = '';
        this.modal = true;
        this.$nextTick(() => document.getElementById('emp-nombre')?.focus());
      },

      cerrarModal() {
        this.modal = false;
        this.editando = null;
      },

      async guardar() {
        if (!this.form.nombre.trim() || !this.form.sucursal_id) {
          this.formError = 'Completa todos los campos';
          return;
        }
        this.guardando = true;
        this.formError = '';
        try {
          const url = this.editando ? `/empleados/api/${this.editando.id}` : '/empleados/api';
          const res = await fetch(url, {
            method: this.editando ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.form)
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || 'Error al guardar');
          }
          const data = await res.json();
          if (this.editando) {
            const idx = this.empleados.findIndex(e => e.id === this.editando.id);
            if (idx !== -1) this.empleados[idx] = { ...this.empleados[idx], ...this.form };
          } else {
            this.empleados.push(data);
          }
          avisar(this.editando ? 'Empleado actualizado' : 'Empleado agregado', 'exito');
          this.cerrarModal();
        } catch (e) {
          this.formError = e instanceof TypeError
            ? 'Sin conexión con el servidor'   // fetch rechaza asi cuando no hay red
            : (e.message || 'No se pudo guardar');
        } finally {
          this.guardando = false;
        }
      },

      // Objeto y no argumentos sueltos: ya son cinco y en la llamada no se
      // distingue cual es cual.
      pedir(opciones) {
        return new Promise(resolve => {
          this.confirm = {
            show: true, titulo: '', mensaje: '', detalle: '',
            tipo: 'danger', btnOk: 'Confirmar', ...opciones, resolve
          };
          // El foco arranca en Cancelar: desde aqui se borra sin vuelta atras.
          this.$nextTick(() => this.$refs.confirmCancelar?.focus());
        });
      },
      cerrarConfirm(valor) {
        this.confirm.show = false;
        this.confirm.resolve(valor);
      },

      async darBaja(emp) {
        const ok = await this.pedir({
          titulo: 'Dar de baja',
          mensaje: `¿Dar de baja a ${emp.nombre}? Seguirá apareciendo en nóminas anteriores pero no podrá registrar turnos nuevos.`,
          btnOk: 'Dar de baja',
        });
        if (!ok) return;
        const enviado = await enviar(`/empleados/api/${emp.id}`, { method: 'DELETE' },
          'No se pudo dar de baja al empleado');
        if (!enviado) return;
        const idx = this.empleados.findIndex(e => e.id === emp.id);
        if (idx !== -1) this.empleados[idx].activo = false;
        avisar(`${emp.nombre} dado de baja`, 'exito');
      },

      async reactivar(emp) {
        const ok = await this.pedir({
          titulo: 'Reactivar empleado',
          mensaje: `¿Reactivar a ${emp.nombre}?`,
          tipo: 'success', btnOk: 'Reactivar',
        });
        if (!ok) return;
        const enviado = await enviarJSON(`/empleados/api/${emp.id}`, 'PUT',
          { nombre: emp.nombre, sucursal_id: emp.sucursal_id, activo: true },
          'No se pudo reactivar al empleado');
        if (!enviado) return;
        const idx = this.empleados.findIndex(e => e.id === emp.id);
        if (idx !== -1) this.empleados[idx].activo = true;
        avisar(`${emp.nombre} reactivado`, 'exito');
      },

      async eliminar(emp) {
        const ok = await this.pedir({
          titulo: `Eliminar a ${emp.nombre}`,
          mensaje: 'Desaparece de la lista y ya no se le podrán capturar turnos. Los turnos que ya tiene registrados se conservan, así que las nóminas de semanas pasadas no cambian.',
          detalle: 'Esta acción no se puede deshacer. Si solo dejó de trabajar, usa «Dar de baja».',
          btnOk: 'Eliminar',
        });
        if (!ok) return;
        const enviado = await enviar(`/empleados/api/${emp.id}/definitivo`, { method: 'DELETE' },
          'No se pudo eliminar al empleado');
        if (!enviado) return;
        this.empleados = this.empleados.filter(e => e.id !== emp.id);
        avisar(`${emp.nombre} eliminado`, 'exito');
      }
    }
  }
</script>
{% endblock %}
