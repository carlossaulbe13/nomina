{% extends "base.html" %}
{% block title %}Usuarios{% endblock %}

{% block content %}
<div x-data="usuariosApp()" x-init="init()">

  <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="titulo">Usuarios del sistema</h1>
      <p class="mt-1 text-sm text-arena-500">Quién puede entrar y con qué permisos</p>
    </div>
    <button @click="abrirModal()" class="btn btn-primario w-full sm:w-auto">
      <span class="text-base leading-none">＋</span> Nuevo usuario
    </button>
  </header>

  <!-- Celular: tarjetas -->
  <ul class="tarjeta divide-y divide-arena-200 md:hidden">
    <template x-if="loading">
      <li class="px-5 py-12 text-center text-sm text-arena-400">Cargando…</li>
    </template>
    <template x-for="u in usuarios" :key="u.uid">
      <li class="px-4 py-4">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="truncate font-medium text-arena-900" x-text="u.nombre"></p>
            <p class="mt-0.5 truncate text-sm text-arena-500" x-text="'@' + u.usuario"></p>
          </div>
          <span :class="u.activo ? 'bg-emerald-100 text-emerald-800' : 'bg-arena-200 text-arena-600'"
                class="chip shrink-0" x-text="u.activo ? 'Activo' : 'Inactivo'"></span>
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-2">
          <span :class="u.role === 'dueno' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'"
                class="chip" x-text="u.role === 'dueno' ? 'Dueño' : 'Encargado'"></span>
          <span class="chip bg-arena-200 text-arena-600" x-text="sucursalNombre(u.sucursal_id)"></span>
        </div>
        <div class="mt-3 flex gap-2">
          <button @click="abrirModal(u)" class="btn btn-secundario btn-sm flex-1">Editar</button>
          <button @click="toggleActivo(u)" class="btn btn-secundario btn-sm flex-1"
                  :class="u.activo ? 'text-red-600' : 'text-emerald-700'"
                  x-text="u.activo ? 'Desactivar' : 'Activar'"></button>
        </div>
      </li>
    </template>
    <template x-if="!loading && usuarios.length === 0">
      <li class="px-5 py-12 text-center text-sm text-arena-400">Sin usuarios</li>
    </template>
  </ul>

  <!-- Tablet y escritorio: tabla -->
  <div class="tarjeta hidden overflow-hidden md:block">
    <div class="overflow-x-auto scroll-suave">
      <table class="w-full text-sm">
        <thead class="bg-arena-50 text-arena-600">
          <tr>
            <th class="th">Nombre</th>
            <th class="th">Usuario</th>
            <th class="th">Rol</th>
            <th class="th">Sucursal</th>
            <th class="th text-center">Estado</th>
            <th class="th text-right">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-arena-200">
          <template x-if="loading">
            <tr><td colspan="6" class="px-4 py-12 text-center text-arena-400">Cargando…</td></tr>
          </template>
          <template x-for="u in usuarios" :key="u.uid">
            <tr class="transition hover:bg-arena-50">
              <td class="td font-medium text-arena-900" x-text="u.nombre"></td>
              <td class="td text-arena-600" x-text="u.usuario"></td>
              <td class="td">
                <span :class="u.role === 'dueno' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'"
                      class="chip" x-text="u.role === 'dueno' ? 'Dueño' : 'Encargado'"></span>
              </td>
              <td class="td text-arena-600" x-text="sucursalNombre(u.sucursal_id)"></td>
              <td class="td text-center">
                <span :class="u.activo ? 'bg-emerald-100 text-emerald-800' : 'bg-arena-200 text-arena-600'"
                      class="chip" x-text="u.activo ? 'Activo' : 'Inactivo'"></span>
              </td>
              <!-- Igual que en empleados: el td tenia `flex` y rompia la tabla. -->
              <td class="td">
                <div class="flex justify-end gap-2">
                  <button @click="abrirModal(u)" class="btn btn-secundario btn-sm">Editar</button>
                  <button @click="toggleActivo(u)" class="btn btn-secundario btn-sm"
                          :class="u.activo ? 'text-red-600' : 'text-emerald-700'"
                          x-text="u.activo ? 'Desactivar' : 'Activar'"></button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal de confirmación (antes era un confirm() del navegador) -->
  <div x-show="confirm.show" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end justify-center bg-arena-950/40 p-4 backdrop-blur-sm sm:items-center"
       @click.self="cerrarConfirm(false)" @keydown.escape.window="if (confirm.show) cerrarConfirm(false)"
       role="dialog" aria-modal="true" aria-labelledby="titulo-confirm">
    <div class="tarjeta w-full max-w-md overflow-hidden shadow-flotante">
      <div class="flex items-start gap-3.5 px-6 pb-4 pt-6">
        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-lg"
              :class="confirm.tipo === 'danger' ? 'bg-red-100' : 'bg-emerald-100'"
              x-text="confirm.tipo === 'danger' ? '⚠️' : '✅'"></span>
        <div>
          <h3 id="titulo-confirm" class="font-semibold text-arena-900" x-text="confirm.titulo"></h3>
          <p class="mt-1 text-sm text-arena-600" x-text="confirm.mensaje"></p>
        </div>
      </div>
      <div class="flex flex-col-reverse gap-2 border-t border-arena-200 bg-arena-50 px-5 py-4 sm:flex-row sm:justify-end">
        <button @click="cerrarConfirm(false)" class="btn btn-secundario">Cancelar</button>
        <button @click="cerrarConfirm(true)" class="btn"
                :class="confirm.tipo === 'danger' ? 'btn-peligro' : 'bg-emerald-600 text-white hover:bg-emerald-700'"
                x-text="confirm.btnOk"></button>
      </div>
    </div>
  </div>

  <!-- Modal alta / edición -->
  <div x-show="modal" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end justify-center overflow-y-auto bg-arena-950/40 p-4 backdrop-blur-sm sm:items-center"
       @click.self="cerrarModal()" @keydown.escape.window="if (modal) cerrarModal()"
       role="dialog" aria-modal="true" aria-labelledby="titulo-usuario">
    <div class="tarjeta my-auto w-full max-w-md overflow-hidden shadow-flotante">
      <div class="px-6 pb-5 pt-6">
        <h3 id="titulo-usuario" class="mb-5 font-marca text-xl font-semibold text-arena-900"
            x-text="editando ? 'Editar usuario' : 'Nuevo usuario'"></h3>

        <div class="space-y-4">
          <div>
            <label for="us-nombre" class="etiqueta">Nombre completo</label>
            <input id="us-nombre" x-model="form.nombre" type="text" class="campo">
          </div>

          <div x-show="!editando" x-cloak>
            <label for="us-usuario" class="etiqueta">Nombre de usuario</label>
            <input id="us-usuario" x-model="form.usuario" type="text" class="campo"
                   autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ej: maria_6pte">
          </div>

          <div>
            <label for="us-password" class="etiqueta">
              Contraseña
              <span x-show="editando" x-cloak class="font-normal text-arena-400">(vacío = no cambiar)</span>
            </label>
            <input id="us-password" x-model="form.password" type="password" class="campo"
                   autocomplete="new-password" placeholder="mínimo 6 caracteres">
          </div>

          <div>
            <span class="etiqueta">Rol</span>
            <div class="grid grid-cols-2 gap-2">
              <template x-for="[valor, texto] in [['encargado','Encargado'],['dueno','Dueño']]" :key="valor">
                <button type="button" @click="form.role = valor" :aria-pressed="form.role === valor"
                        :class="form.role === valor
                          ? 'border-marca-600 bg-marca-50 text-marca-800'
                          : 'border-arena-300 bg-white text-arena-600 hover:bg-arena-50'"
                        class="btn border-2" x-text="texto"></button>
              </template>
            </div>
          </div>

          <div x-show="form.role === 'encargado'" x-cloak>
            <label for="us-sucursal" class="etiqueta">Sucursal</label>
            <select id="us-sucursal" x-model="form.sucursal_id" class="campo campo-select">
              <option value="">Seleccionar…</option>
              {% for sid, sname in sucursales.items() %}
              <option value="{{ sid }}">{{ sname }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div x-show="formError" x-cloak
             class="mt-4 rounded-xl border border-red-200 bg-red-50 px-3.5 py-2.5 text-sm font-medium text-red-800"
             x-text="formError"></div>
      </div>

      <div class="flex flex-col-reverse gap-2 border-t border-arena-200 bg-arena-50 px-5 py-4 sm:flex-row sm:justify-end">
        <button @click="cerrarModal()" class="btn btn-secundario">Cancelar</button>
        <button @click="guardar()" :disabled="guardando" class="btn btn-primario"
                x-text="guardando ? 'Guardando…' : 'Guardar'"></button>
      </div>
    </div>
  </div>

</div>

<script>
  const SUCURSALES = {{ sucursales | tojson }};

  function usuariosApp() {
    return {
      usuarios: [],
      loading: true,
      modal: false,
      editando: null,
      form: { nombre: '', usuario: '', password: '', role: 'encargado', sucursal_id: '' },
      formError: '',
      guardando: false,
      confirm: { show: false, titulo: '', mensaje: '', tipo: 'danger', btnOk: 'Confirmar', resolve: null },

      async init() {
        try {
          const res = await fetch('/usuarios/api');
          if (!res.ok) throw new Error();
          this.usuarios = await res.json();
        } catch (_) {
          avisar('No se pudo cargar la lista de usuarios');
        } finally {
          this.loading = false;
        }
      },

      sucursalNombre(id) { return SUCURSALES[id] || id || '—'; },

      abrirModal(u = null) {
        this.editando = u;
        this.form = u
          ? { nombre: u.nombre, usuario: u.usuario, password: '', role: u.role, sucursal_id: u.sucursal_id }
          : { nombre: '', usuario: '', password: '', role: 'encargado', sucursal_id: '' };
        this.formError = '';
        this.modal = true;
        this.$nextTick(() => document.getElementById('us-nombre')?.focus());
      },

      cerrarModal() {
        this.modal = false;
        this.editando = null;
      },

      async guardar() {
        this.formError = '';
        if (!this.form.nombre.trim()) { this.formError = 'El nombre es requerido'; return; }
        if (!this.editando && !this.form.usuario.trim()) { this.formError = 'El usuario es requerido'; return; }
        if (!this.editando && this.form.password.length < 6) { this.formError = 'La contraseña debe tener al menos 6 caracteres'; return; }
        if (this.form.role === 'encargado' && !this.form.sucursal_id) { this.formError = 'Selecciona una sucursal'; return; }

        this.guardando = true;
        try {
          const url = this.editando ? `/usuarios/api/${this.editando.uid}` : '/usuarios/api';
          const res = await fetch(url, {
            method: this.editando ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.form)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) { this.formError = data.error || 'Error al guardar'; return; }

          if (this.editando) {
            const idx = this.usuarios.findIndex(u => u.uid === this.editando.uid);
            if (idx !== -1) this.usuarios[idx] = { ...this.usuarios[idx], ...this.form };
          } else {
            this.usuarios.push(data);
          }
          avisar(this.editando ? 'Usuario actualizado' : 'Usuario creado', 'exito');
          this.cerrarModal();
        } catch (_) {
          this.formError = 'Sin conexión con el servidor';
        } finally {
          this.guardando = false;
        }
      },

      pedir(titulo, mensaje, tipo = 'danger', btnOk = 'Confirmar') {
        return new Promise(resolve => {
          this.confirm = { show: true, titulo, mensaje, tipo, btnOk, resolve };
        });
      },
      cerrarConfirm(valor) {
        this.confirm.show = false;
        this.confirm.resolve(valor);
      },

      async toggleActivo(u) {
        const desactivar = u.activo;
        const ok = await this.pedir(
          desactivar ? 'Desactivar usuario' : 'Activar usuario',
          desactivar
            ? `¿Desactivar a ${u.nombre}? No podrá iniciar sesión.`
            : `¿Activar a ${u.nombre}? Podrá volver a iniciar sesión.`,
          desactivar ? 'danger' : 'success',
          desactivar ? 'Desactivar' : 'Activar'
        );
        if (!ok) return;

        const res = await fetch(`/usuarios/api/${u.uid}/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo: !u.activo })
        });
        if (!await respuestaOk(res, 'No se pudo cambiar el estado del usuario')) return;
        const idx = this.usuarios.findIndex(x => x.uid === u.uid);
        if (idx !== -1) this.usuarios[idx].activo = !u.activo;
        avisar(desactivar ? 'Usuario desactivado' : 'Usuario activado', 'exito');
      }
    }
  }
</script>
{% endblock %}
